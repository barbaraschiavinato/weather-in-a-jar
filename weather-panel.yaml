substitutions:
  name: weather-panel
  friendly_name: Weather panel
  jar_host: !secret weather_jar_ip

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # Draw the UI first, then let Wi-Fi settle. Network data loading is
      # orchestrated by initial_load so status/forecast never start together.
      - delay: 1s
      - script.execute: initial_load

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret weather_panel_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  on_connect:
    then:
      - logger.log:
          level: INFO
          tag: wifi_debug
          format: "Wi-Fi CONNECTED - waiting for network details..."
      # initial_load owns the first network refresh. This avoids a second
      # pair of requests racing the on_boot sequence.
      - if:
          condition:
            lambda: 'return !id(initial_load_done) && !id(initial_load_running);'
          then:
            - script.execute: initial_load
  on_disconnect:
    then:
      - logger.log:
          level: WARN
          tag: wifi_debug
          format: "Wi-Fi DISCONNECTED"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Weather Panel IP"
      id: panel_ip
      internal: true
      on_value:
        then:
          - logger.log:
              level: INFO
              tag: wifi_debug
              format: "IP address: %s"
              args: ['x.c_str()']
    ssid:
      name: "Weather Panel SSID"
      id: panel_ssid
      internal: true
      on_value:
        then:
          - logger.log:
              level: INFO
              tag: wifi_debug
              format: "Connected SSID: %s"
              args: ['x.c_str()']
    bssid:
      name: "Weather Panel BSSID"
      id: panel_bssid
      internal: true
      on_value:
        then:
          - logger.log:
              level: INFO
              tag: wifi_debug
              format: "Access point BSSID: %s"
              args: ['x.c_str()']
    mac_address:
      name: "Weather Panel MAC"
      id: panel_mac
      internal: true
      on_value:
        then:
          - logger.log:
              level: INFO
              tag: wifi_debug
              format: "Panel MAC: %s"
              args: ['x.c_str()']

sensor:
  - platform: wifi_signal
    name: "Weather Panel WiFi Signal"
    id: panel_wifi_signal
    internal: true
    update_interval: 30s
    on_value:
      then:
        - logger.log:
            level: DEBUG
            tag: wifi_debug
            format: "Wi-Fi signal: %.0f dBm"
            args: ['x']
http_request:
  id: http_client
  timeout: 10s
  verify_ssl: true
  follow_redirects: true

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO2
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

i2c:
  id: touch_i2c
  sda: GPIO19
  scl: GPIO20
  scan: true

display:
  - platform: rpi_dpi_rgb
    id: main_display
    update_interval: never
    color_order: RGB
    pclk_frequency: 16MHz
    pclk_inverted: true
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display
    i2c_id: touch_i2c
    address: 0x5D

font:
  - file: {type: gfonts, family: Roboto, weight: 400}
    id: font_14
    size: 14
  - file: {type: gfonts, family: Roboto, weight: 500}
    id: font_16
    size: 16
  - file: {type: gfonts, family: Roboto, weight: 700}
    id: font_18
    size: 18
  - file: {type: gfonts, family: Roboto, weight: 700}
    id: font_22
    size: 22
  - file: {type: gfonts, family: Roboto, weight: 700}
    id: font_52
    size: 52
  - file:
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: mdi_icons_24
    size: 24
    glyphs: [
      "\U000F0595",  # Partly Cloudy
      "\U000F0156",  # Close
      "\U000F0599",  # Sunny
      "\U000F0590",  # Cloudy
      "\U000F0591",  # Foggy
      "\U000F0597",  # Rainy
      "\U000F0598",  # Snowy
      "\U000F0593",  # Lightning
      "\U000F0594",  # Clear night
    ]
  - file:
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: mdi_icons_64
    size: 64
    glyphs: [
      "\U000F0595",
      "\U000F0599",
      "\U000F0590",
      "\U000F0591",
      "\U000F0597",
      "\U000F0598",
      "\U000F0593",
      "\U000F0594",
    ]

globals:
  - id: forecast_mode_0
    type: std::string
    initial_value: '"partly_cloudy"'
  - id: forecast_mode_1
    type: std::string
    initial_value: '"partly_cloudy"'
  - id: forecast_mode_2
    type: std::string
    initial_value: '"partly_cloudy"'
  - id: forecast_mode_3
    type: std::string
    initial_value: '"partly_cloudy"'
  - id: forecast_mode_4
    type: std::string
    initial_value: '"partly_cloudy"'
  - id: forecast_day_0
    type: std::string
    initial_value: '"TODAY"'
  - id: forecast_day_1
    type: std::string
    initial_value: '"—"'
  - id: forecast_day_2
    type: std::string
    initial_value: '"—"'
  - id: forecast_day_3
    type: std::string
    initial_value: '"—"'
  - id: forecast_day_4
    type: std::string
    initial_value: '"—"'
  - id: forecast_max_0
    type: float
    initial_value: '0.0'
  - id: forecast_max_1
    type: float
    initial_value: '0.0'
  - id: forecast_max_2
    type: float
    initial_value: '0.0'
  - id: forecast_max_3
    type: float
    initial_value: '0.0'
  - id: forecast_max_4
    type: float
    initial_value: '0.0'
  - id: forecast_min_0
    type: float
    initial_value: '0.0'
  - id: forecast_min_1
    type: float
    initial_value: '0.0'
  - id: forecast_min_2
    type: float
    initial_value: '0.0'
  - id: forecast_min_3
    type: float
    initial_value: '0.0'
  - id: forecast_min_4
    type: float
    initial_value: '0.0'
  - id: initial_load_running
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: initial_load_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: status_loading
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: forecast_loading
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: selected_forecast_offset
    type: int
    restore_value: no
    initial_value: '-1'

script:
  - id: initial_load
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(initial_load_done) && !id(initial_load_running);'
          then:
            - lambda: |-
                id(initial_load_running) = true;
                id(status_loading) = true;
                id(forecast_loading) = true;
            - script.execute: update_loading_spinner
            # Give LVGL/display/PSRAM time to finish their first draw before
            # doing HTTP + JSON work.
            - delay: 1500ms
            - wait_until:
                condition:
                  wifi.connected:
                timeout: 15s
            - if:
                condition:
                  wifi.connected:
                then:
                  # Status first.
                  - script.execute: refresh_jar_status
                  - script.wait: refresh_jar_status
                  - delay: 300ms
                  # Forecast second.
                  - script.execute: refresh_jar_forecast
                  - script.wait: refresh_jar_forecast
                else:
                  - logger.log:
                      level: WARN
                      tag: startup
                      format: "Initial load timed out waiting for Wi-Fi"
            - lambda: |-
                id(initial_load_running) = false;
                id(initial_load_done) = true;
                id(status_loading) = false;
                id(forecast_loading) = false;
            - script.execute: update_loading_spinner

  - id: update_loading_spinner
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(status_loading) || id(forecast_loading);'
          then:
            - lvgl.widget.show: loading_spinner
          else:
            - lvgl.widget.hide: loading_spinner

  - id: refresh_jar_status
    mode: restart
    then:
      - lambda: 'id(status_loading) = true;'
      - script.execute: update_loading_spinner
      - logger.log:
          level: INFO
          tag: jar_debug
          format: "Requesting Jar: http://${jar_host}/api/status"
      - http_request.get:
          url: "http://${jar_host}/api/status"
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("jar_debug", "Jar responded - HTTP %d, body length: %u bytes", response->status_code, (unsigned) body.size());
                  if (response->status_code != 200) {
                    ESP_LOGE("jar_debug", "Jar HTTP error: %d", response->status_code);
                    char b[48];
                    snprintf(b, sizeof(b), "JAR HTTP %d", response->status_code);
                    lv_label_set_text(id(current_condition), b);
                    return;
                  }

                  bool ok = json::parse_json(body, [&](JsonObject root) -> bool {
                    if (root["weather"].isNull() || root["temperature"].isNull()) return false;

                    const char *weather = root["weather"] | "unknown";
                    const char *period = root["period"] | "day";
                    const char *source = root["source"] | "unknown";
                    float temperature = root["temperature"] | 0.0f;
                    float precipitation = root["precipitation"] | 0.0f;
                    float rain = root["rain"] | 0.0f;
                    const char *location = root["location"] | "—";
                    int brightness_percent = root["brightnessPercent"] | 0;

                    lv_label_set_text(id(location_value), location);

                    char brightness_text[16];
                    snprintf(brightness_text, sizeof(brightness_text), "%d%%", brightness_percent);
                    lv_label_set_text(id(brightness_value), brightness_text);

                    ESP_LOGI(
                      "jar_debug",
                      "Jar JSON OK - weather=%s temperature=%.1f period=%s source=%s precip=%.1f rain=%.1f",
                      weather, temperature, period, source, precipitation, rain
                    );

                    const bool night = strcmp(period, "night") == 0;
                    const char *icon = "\U000F0590";
                    const char *label = "UNKNOWN";

                    if (strcmp(weather, "clear") == 0) {
                      icon = night ? "\U000F0594" : "\U000F0599";
                      label = "CLEAR";
                    } else if (strcmp(weather, "mainly_clear") == 0) {
                      icon = night ? "\U000F0594" : "\U000F0595";
                      label = "MAINLY CLEAR";
                    } else if (strcmp(weather, "partly_cloudy") == 0) {
                      icon = "\U000F0595";
                      label = "PARTLY CLOUDY";
                    } else if (strcmp(weather, "overcast") == 0) {
                      icon = "\U000F0590";
                      label = "OVERCAST";
                    } else if (strcmp(weather, "fog") == 0) {
                      icon = "\U000F0591";
                      label = "FOG";
                    } else if (strcmp(weather, "drizzle") == 0) {
                      icon = "\U000F0597";
                      label = "DRIZZLE";
                    } else if (strcmp(weather, "rain") == 0) {
                      icon = "\U000F0597";
                      label = "RAIN";
                    } else if (strcmp(weather, "snow") == 0) {
                      icon = "\U000F0598";
                      label = "SNOW";
                    } else if (strcmp(weather, "thunderstorm") == 0 || strcmp(weather, "storm") == 0) {
                      icon = "\U000F0593";
                      label = "THUNDERSTORM";
                    }

                    if (id(selected_forecast_offset) < 0) {
                      lv_label_set_text(id(current_weather_icon), icon);

                      char b[96];
                      snprintf(b, sizeof(b), "%.1f°", temperature);
                      lv_label_set_text(id(current_temperature), b);
                      lv_label_set_text(id(current_condition), label);

                      snprintf(
                        b, sizeof(b),
                        "%s  •  %s\nPrecip. %.1f mm  •  Rain %.1f mm",
                        period, source, precipitation, rain
                      );
                      lv_label_set_text(id(current_details), b);
                    }

                    return true;
                  });

                  if (!ok) {
                    ESP_LOGE("jar_debug", "Jar response received but JSON is invalid or required fields are missing");
                    ESP_LOGD("jar_debug", "Raw Jar response: %s", body.c_str());
                    lv_label_set_text(id(current_condition), "JAR JSON ERROR");
                  }
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  tag: jar_debug
                  format: "JAR CONNECTION ERROR - transport request to http://${jar_host}/api/status failed"
              - lvgl.label.update:
                  id: current_condition
                  text: "JAR CONNECTION ERROR"
      - lambda: 'id(status_loading) = false;'
      - script.execute: update_loading_spinner

  - id: refresh_jar_forecast
    mode: restart
    then:
      - lambda: 'id(forecast_loading) = true;'
      - script.execute: update_loading_spinner
      - logger.log:
          level: INFO
          tag: forecast_debug
          format: "Requesting forecast: http://${jar_host}/api/forecast"
      - http_request.get:
          url: "http://${jar_host}/api/forecast"
          capture_response: true
          max_response_buffer_size: 12288
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("forecast_debug", "Forecast response HTTP %d, %u bytes", response->status_code, (unsigned) body.size());
                  if (response->status_code != 200) {
                    ESP_LOGE("forecast_debug", "Forecast HTTP error: %d", response->status_code);
                    return;
                  }

                  bool ok = json::parse_json(body, [&](JsonObject root) -> bool {
                    if (!(root["valid"] | false) || root["days"].isNull()) return false;

                    JsonArray days = root["days"].as<JsonArray>();
                    if (days.size() < 5) return false;

                    lv_obj_t *labels[5] = {id(day0_label), id(day1_label), id(day2_label), id(day3_label), id(day4_label)};
                    lv_obj_t *icons[5]  = {id(day0_icon),  id(day1_icon),  id(day2_icon),  id(day3_icon),  id(day4_icon)};
                    lv_obj_t *temps[5]  = {id(day0_temp),  id(day1_temp),  id(day2_temp),  id(day3_temp),  id(day4_temp)};

                    for (int i = 0; i < 5; i++) {
                      JsonObject d = days[i];
                      if (!(d["valid"] | false)) continue;

                      const char *date = d["date"] | "";
                      const char *weather = d["weather"] | "unknown";
                      float tmax = d["temperatureMax"] | 0.0f;
                      float tmin = d["temperatureMin"] | 0.0f;

                      if (i == 0) {
                        id(forecast_mode_0) = weather;
                        id(forecast_day_0) = "TODAY";
                        id(forecast_max_0) = tmax;
                        id(forecast_min_0) = tmin;
                      } else if (i == 1) {
                        id(forecast_mode_1) = weather;
                        id(forecast_max_1) = tmax;
                        id(forecast_min_1) = tmin;
                      } else if (i == 2) {
                        id(forecast_mode_2) = weather;
                        id(forecast_max_2) = tmax;
                        id(forecast_min_2) = tmin;
                      } else if (i == 3) {
                        id(forecast_mode_3) = weather;
                        id(forecast_max_3) = tmax;
                        id(forecast_min_3) = tmin;
                      } else if (i == 4) {
                        id(forecast_mode_4) = weather;
                        id(forecast_max_4) = tmax;
                        id(forecast_min_4) = tmin;
                      }

                      const char *icon = "\U000F0590";
                      if (strcmp(weather, "clear") == 0) icon = "\U000F0599";
                      else if (strcmp(weather, "mainly_clear") == 0) icon = "\U000F0595";
                      else if (strcmp(weather, "partly_cloudy") == 0) icon = "\U000F0595";
                      else if (strcmp(weather, "overcast") == 0) icon = "\U000F0590";
                      else if (strcmp(weather, "fog") == 0) icon = "\U000F0591";
                      else if (strcmp(weather, "drizzle") == 0) icon = "\U000F0597";
                      else if (strcmp(weather, "rain") == 0) icon = "\U000F0597";
                      else if (strcmp(weather, "snow") == 0) icon = "\U000F0598";
                      else if (strcmp(weather, "thunderstorm") == 0 || strcmp(weather, "storm") == 0) icon = "\U000F0593";

                      lv_label_set_text(icons[i], icon);

                      char temp[40];
                      snprintf(temp, sizeof(temp), "%.1f° / %.1f°", tmax, tmin);
                      lv_label_set_text(temps[i], temp);

                      if (i == 0) {
                        lv_label_set_text(labels[i], "TODAY");
                      } else {
                        int y = 0, m = 0, day = 0;
                        char day_name[16] = "—";
                        if (sscanf(date, "%d-%d-%d", &y, &m, &day) == 3) {
                          struct tm tmv = {};
                          tmv.tm_year = y - 1900;
                          tmv.tm_mon = m - 1;
                          tmv.tm_mday = day;
                          tmv.tm_hour = 12;
                          tmv.tm_isdst = -1;
                          if (mktime(&tmv) != (time_t)-1) {
                            char full_day_name[20] = "—";
                            strftime(day_name, sizeof(day_name), "%a", &tmv);
                            strftime(full_day_name, sizeof(full_day_name), "%A", &tmv);
                            for (char *c = day_name; *c; ++c) *c = toupper((unsigned char)*c);
                            for (char *c = full_day_name; *c; ++c) *c = toupper((unsigned char)*c);
                            if (i == 1) id(forecast_day_1) = full_day_name;
                            else if (i == 2) id(forecast_day_2) = full_day_name;
                            else if (i == 3) id(forecast_day_3) = full_day_name;
                            else if (i == 4) id(forecast_day_4) = full_day_name;
                          }
                        }
                        lv_label_set_text(labels[i], day_name);
                      }

                      ESP_LOGI("forecast_debug", "Day %d: %s %s %.1f/%.1f", i, date, weather, tmax, tmin);
                    }
                    return true;
                  });

                  if (!ok) {
                    ESP_LOGE("forecast_debug", "Forecast JSON invalid or incomplete");
                    ESP_LOGD("forecast_debug", "Raw forecast response: %s", body.c_str());
                  }
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  tag: forecast_debug
                  format: "FORECAST CONNECTION ERROR"
      - lambda: 'id(forecast_loading) = false;'
      - script.execute: update_loading_spinner

  - id: live
    mode: restart
    then:
      - lambda: 'id(selected_forecast_offset) = -1;'
      - logger.log:
          level: INFO
          tag: jar_control
          format: "LIVE -> GET http://${jar_host}/api/mock/off"
      - http_request.get:
          url: "http://${jar_host}/api/mock/off"
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("jar_control", "LIVE response HTTP %d: %s", response->status_code, body.c_str());
              - delay: 250ms
              - script.execute: refresh_jar_status
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  tag: jar_control
                  format: "LIVE request failed"

  - id: mock
    mode: restart
    parameters:
      mode: string
    then:
      - lambda: 'id(selected_forecast_offset) = -1;'
      - logger.log:
          level: INFO
          tag: jar_control
          format: "MOCK requested: %s"
          args: ['mode.c_str()']
      - http_request.get:
          url: !lambda |-
            std::string base = "http://${jar_host}";
            if (mode == "loop") return base + "/api/mock/loop";
            if (mode == "sunrise") return base + "/api/mock?period=sunrise";
            if (mode == "sunset") return base + "/api/mock?period=sunset";
            if (mode == "storm") return base + "/api/mock?weather=thunderstorm";
            return base + "/api/mock?weather=" + mode;
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("jar_control", "MOCK response HTTP %d: %s", response->status_code, body.c_str());
              - delay: 250ms
              - script.execute: refresh_jar_status
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  tag: jar_control
                  format: "MOCK request failed"

  - id: brightness_down
    mode: restart
    then:
      - http_request.get:
          url: "http://${jar_host}/api/brightness?action=down"
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("brightness_control", "Brightness DOWN HTTP %d: %s", response->status_code, body.c_str());
              - delay: 150ms
              - script.execute: refresh_jar_status
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  tag: brightness_control
                  format: "Brightness DOWN request failed"

  - id: brightness_up
    mode: restart
    then:
      - http_request.get:
          url: "http://${jar_host}/api/brightness?action=up"
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("brightness_control", "Brightness UP HTTP %d: %s", response->status_code, body.c_str());
              - delay: 150ms
              - script.execute: refresh_jar_status
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  tag: brightness_control
                  format: "Brightness UP request failed"

  - id: forecast
    mode: restart
    parameters:
      offset: int
      weather: string
    then:
      - lambda: 'id(selected_forecast_offset) = offset;'
      - logger.log:
          level: INFO
          tag: forecast_control
          format: "FORECAST day +%d -> %s"
          args: ['offset', 'weather.c_str()']
      - http_request.get:
          url: !lambda |-
            return std::string("http://${jar_host}/api/mock?weather=") + weather;
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("forecast_control", "Forecast selection HTTP %d: %s", response->status_code, body.c_str());
                  if (response->status_code != 200) return;

                  std::string day_name = "FORECAST";
                  float tmax = 0.0f;
                  float tmin = 0.0f;

                  if (offset == 0) { day_name = id(forecast_day_0); tmax = id(forecast_max_0); tmin = id(forecast_min_0); }
                  else if (offset == 1) { day_name = id(forecast_day_1); tmax = id(forecast_max_1); tmin = id(forecast_min_1); }
                  else if (offset == 2) { day_name = id(forecast_day_2); tmax = id(forecast_max_2); tmin = id(forecast_min_2); }
                  else if (offset == 3) { day_name = id(forecast_day_3); tmax = id(forecast_max_3); tmin = id(forecast_min_3); }
                  else if (offset == 4) { day_name = id(forecast_day_4); tmax = id(forecast_max_4); tmin = id(forecast_min_4); }

                  const char *icon = "\U000F0590";
                  const char *label = "UNKNOWN";
                  if (weather == "clear") { icon = "\U000F0599"; label = "CLEAR"; }
                  else if (weather == "mainly_clear") { icon = "\U000F0595"; label = "MAINLY CLEAR"; }
                  else if (weather == "partly_cloudy") { icon = "\U000F0595"; label = "PARTLY CLOUDY"; }
                  else if (weather == "overcast") { icon = "\U000F0590"; label = "OVERCAST"; }
                  else if (weather == "fog") { icon = "\U000F0591"; label = "FOG"; }
                  else if (weather == "drizzle") { icon = "\U000F0597"; label = "DRIZZLE"; }
                  else if (weather == "rain") { icon = "\U000F0597"; label = "RAIN"; }
                  else if (weather == "snow") { icon = "\U000F0598"; label = "SNOW"; }
                  else if (weather == "thunderstorm" || weather == "storm") { icon = "\U000F0593"; label = "THUNDERSTORM"; }

                  lv_label_set_text(id(current_weather_icon), icon);
                  lv_label_set_text(id(current_condition), label);

                  char b[96];
                  snprintf(b, sizeof(b), "%.1f° / %.1f°", tmax, tmin);
                  lv_label_set_text(id(current_temperature), b);

                  snprintf(b, sizeof(b), "%s  •  FORECAST", day_name.c_str());
                  lv_label_set_text(id(current_details), b);
          on_error:
            then:
              - logger.log:
                  level: ERROR
                  tag: forecast_control
                  format: "Forecast selection request failed"

interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(initial_load_done) && !id(initial_load_running);'
          then:
            - script.execute: refresh_jar_status
  - interval: 15min
    then:
      - if:
          condition:
            lambda: 'return id(initial_load_done) && !id(initial_load_running);'
          then:
            - script.execute: refresh_jar_forecast

